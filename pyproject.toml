[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chexpert-cls"
version = "1.3.0"
description = "Multi-label chest X-ray classification on CheXpert with DenseNet121 and Grad-CAM"
authors = [{ name = "Athrva Raval" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "Pillow",
  "huggingface_hub",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart", "prometheus-client"]
track = ["mlflow>=2.10"]
demo = ["gradio>=4"]
dev = ["pytest", "ruff", "httpx", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
# correctness only: syntax errors + pyflakes (unused/undefined names)
select = ["E9", "F"]
