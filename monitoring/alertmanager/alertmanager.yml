# Default Alertmanager config: alerts are grouped and visible at http://localhost:9093,
# but nothing is sent anywhere. To get emails, run once:
#   python scripts/setup_alert_email.py
# which writes alertmanager.local.yml + secrets/ (both git-ignored) and a .env
# telling docker compose to use them.
route:
  receiver: dashboard-only
  group_by: [alertname, finding]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: dashboard-only

inhibit_rules:
  # If the API is down, don't also spam about errors/latency/drift.
  - source_matchers: [alertname="ChexpertApiDown"]
    target_matchers: [alertname=~"ChexpertHighErrorRate|ChexpertSlowPredictions|ChexpertPredictionDrift"]
