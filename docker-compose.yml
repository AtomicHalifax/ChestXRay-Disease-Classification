# Local stack: inference API + MLflow tracking + Prometheus/Grafana monitoring.
#   docker compose up --build
#   API:        http://localhost:8000/docs
#   MLflow:     http://localhost:5000
#   Prometheus: http://localhost:9090   (Alerts tab shows the rules)
#   Grafana:    http://localhost:3000   (dashboard "CheXpert API", no login needed)
# Train against the tracking server from the host:
#   MLFLOW_TRACKING_URI=http://localhost:5000 python -m chexpert_cls.train --data-root ... --mlflow
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      CHEXPERT_STRICT_INPUT: "0"
    volumes:
      - hf-cache:/home/app/.cache/huggingface

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes:
      - mlflow-data:/mlflow

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chexpert.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  hf-cache:
  mlflow-data:
